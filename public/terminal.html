<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroRing Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #09090b;
        --surface: #18181b;
        --text: #e4e4e7;
        --border: rgba(255, 255, 255, 0.1);
        --p-user: #a5b4fc;
        --p-colon: #64748b;
        --p-path: #6ee7b7;
        --p-dollar: #cbd5e1;
      }
      
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body {
        background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>'), linear-gradient(180deg, #0f0f13 0%, var(--bg) 100%);
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Fake macOS Window Bar */
      #titlebar {
        background: rgba(20, 20, 25, 0.8);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 10px 16px;
        flex-shrink: 0;
        z-index: 10;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      }
      .back-container {
        display: flex;
        flex: 1;
      }
      .back-btn {
        color: #71717a;
        transition: 0.2s;
        display: flex;
        align-items: center;
        text-decoration: none;
      }
      .back-btn:hover { color: #fff; }
      .title {
        color: #71717a;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        flex: 2;
        text-align: center;
      }
      .spacer { flex: 1; }

      /* Terminal Body */
      #terminal {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        outline: none;
        scroll-behavior: smooth;
        position: relative;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

      #output div { 
        white-space: pre-wrap; 
        line-height: 1.6; 
      }
      
      .echo-line {
        margin-top: 6px;
      }

      .command-text {
        color: #fff;
        margin-left: 8px;
        font-weight: 600;
      }

      #input-line {
        display: none;
        align-items: center;
        line-height: 1.6;
        white-space: pre-wrap;
        margin-top: 6px;
        padding-bottom: 40px;
      }
      
      .prompt-user { color: var(--p-user); font-weight: 700; }
      .prompt-colon { color: var(--p-colon); }
      .prompt-path { color: var(--p-path); font-weight: 700; }
      .prompt-dollar { color: var(--p-dollar); }
      
      #prompt { white-space: pre-wrap; }
      #cmd { color: #fff; white-space: pre-wrap; margin-left: 8px; font-weight: 600; }
      #cursor {
        display: inline-block;
        width: 8px;
        height: 18px;
        background: #fff;
        animation: blink 1s step-end infinite;
        vertical-align: text-bottom;
        margin-left: 2px;
      }
      @keyframes blink { 50% { opacity: 0; } }

      /* Drag Drop overlay */
      #drag-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(99, 102, 241, 0.1);
        border: 2px dashed #6366f1;
        pointer-events: none;
        display: none;
        z-index: 50;
      }

      /* VS Code Style Editor */
      #editor-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 2rem;
      }
      
      .editor-window {
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 12px;
        width: 100%;
        max-width: 900px;
        height: 80vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      #editor-header {
        background: #252526;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0;
        border-bottom: 1px solid #333;
      }
      
      .editor-tabs {
        display: flex;
      }
      
      #editor-filename {
        background: #1e1e1e;
        color: #e4e4e7;
        font-family: sans-serif;
        font-size: 14px;
        padding: 10px 24px;
        border-top: 2px solid #6366f1;
        font-weight: normal;
      }

      .editor-actions {
        padding: 0 16px;
      }

      #editor-textarea {
        flex: 1;
        background: #1e1e1e;
        color: #d4d4d4;
        border: none;
        padding: 1.5rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        line-height: 1.6;
        resize: none;
        outline: none;
      }
      
      .editor-btn {
        background: #6366f1;
        color: #fff;
        border: none;
        padding: 6px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        margin-left: 8px;
        transition: 0.2s;
        font-size: 13px;
      }
      .editor-btn:hover { background: #818cf8; }
      .editor-btn.cancel { background: transparent; color: #a1a1aa; }
      .editor-btn.cancel:hover { background: rgba(255,255,255,0.1); color: #fff; }
    </style>
  </head>
  <body>
    <div id="titlebar">
        <div class="back-container">
            <a href="index.html" class="back-btn" title="Back to Home">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
        </div>
        <div class="title">bash — ZeroRing OS</div>
        <div class="spacer"></div>
    </div>

    <div id="terminal" tabindex="0">
      <div id="drag-overlay"></div>
      <div id="output"></div>
      <div id="input-line">
          <span id="prompt"></span><span id="cmd"></span><span id="cursor"></span>
      </div>
    </div>
    
    <div id="editor-overlay">
      <div class="editor-window">
          <div id="editor-header">
            <div class="editor-tabs">
                <h3 id="editor-filename">filename.txt</h3>
            </div>
            <div class="editor-actions">
              <button class="editor-btn cancel" id="editor-cancel">Cancel</button>
              <button class="editor-btn" id="editor-save">Save File</button>
            </div>
          </div>
          <textarea id="editor-textarea" spellcheck="false"></textarea>
      </div>
    </div>
    
    <script src="terminal.js?v=3"></script>
  </body>
</html>
