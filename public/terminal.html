<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroRing Terminal</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #09090b;
        --surface: #18181b;
        --text: #e4e4e7;
        --border: rgba(255, 255, 255, 0.1);
        --p-user: #a5b4fc;
        --p-colon: #64748b;
        --p-path: #6ee7b7;
        --p-dollar: #cbd5e1;
      }
      
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body {
        background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>'), linear-gradient(180deg, #0f0f13 0%, var(--bg) 100%);
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Fake macOS Window Bar */
      #titlebar {
        background: rgba(20, 20, 25, 0.8);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 10px 16px;
        flex-shrink: 0;
        z-index: 10;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      }
      .back-container {
        display: flex;
        flex: 1;
      }
      .back-btn {
        color: #71717a;
        transition: 0.2s;
        display: flex;
        align-items: center;
        text-decoration: none;
      }
      .back-btn:hover { color: #fff; }
      .title {
        color: #71717a;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        flex: 2;
        text-align: center;
      }
      .spacer { flex: 1; }

      /* Terminal Body */
      #terminal {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        outline: none;
        scroll-behavior: smooth;
        position: relative;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

      #output div { 
        white-space: pre-wrap; 
        line-height: 1.6; 
      }
      
      .echo-line {
        margin-top: 6px;
      }

      .command-text {
        color: #fff;
        margin-left: 8px;
        font-weight: 600;
      }

      #input-line {
        display: none;
        align-items: center;
        line-height: 1.6;
        white-space: pre-wrap;
        margin-top: 6px;
        padding-bottom: 40px;
      }
      
      .prompt-user { color: var(--p-user); font-weight: 700; }
      .prompt-colon { color: var(--p-colon); }
      .prompt-path { color: var(--p-path); font-weight: 700; }
      .prompt-dollar { color: var(--p-dollar); }
      
      #prompt { white-space: pre-wrap; }
      #cmd { color: #fff; white-space: pre-wrap; margin-left: 8px; font-weight: 600; }
      #cursor {
        display: inline-block;
        width: 8px;
        height: 18px;
        background: #fff;
        animation: blink 1s step-end infinite;
        vertical-align: text-bottom;
        margin-left: 2px;
      }
      @keyframes blink { 50% { opacity: 0; } }

      /* Drag Drop overlay */
      #drag-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(99, 102, 241, 0.1);
        border: 2px dashed #6366f1;
        pointer-events: none;
        display: none;
        z-index: 50;
      }

      /* VS Code Style Editor */
      #editor-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 2rem;
      }
      
      .editor-window {
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 12px;
        width: 100%;
        max-width: 900px;
        height: 80vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      #editor-header {
        background: #252526;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0;
        border-bottom: 1px solid #333;
      }
      
      .editor-tabs {
        display: flex;
      }
      
      #editor-filename {
        background: #1e1e1e;
        color: #e4e4e7;
        font-family: sans-serif;
        font-size: 14px;
        padding: 10px 24px;
        border-top: 2px solid #6366f1;
        font-weight: normal;
      }

      .editor-actions {
        padding: 0 16px;
      }

      #editor-textarea {
        flex: 1;
        background: #1e1e1e;
        color: #d4d4d4;
        border: none;
        padding: 1.5rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        line-height: 1.6;
        resize: none;
        outline: none;
      }
      
      .editor-btn {
        background: #6366f1;
        color: #fff;
        border: none;
        padding: 6px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        margin-left: 8px;
        transition: 0.2s;
        font-size: 13px;
      }
      .editor-btn:hover { background: #818cf8; }
      .editor-btn.cancel { background: transparent; color: #a1a1aa; }
      .editor-btn.cancel:hover { background: rgba(255,255,255,0.1); color: #fff; }

      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slideOut {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }

      /* Chat Panel */
      #chat-panel {
        position: fixed;
        top: 0; right: 0; bottom: 0;
        width: 380px;
        background: #111114;
        border-left: 1px solid rgba(255,255,255,0.08);
        display: none;
        flex-direction: column;
        z-index: 900;
        font-family: 'Outfit', 'JetBrains Mono', sans-serif;
        animation: panelSlideIn 0.25s ease-out;
      }
      #chat-panel.open { display: flex; }
      @keyframes panelSlideIn {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }

      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: #0c0c0f;
      }
      .chat-header h3 {
        margin: 0; font-size: 15px; color: #e4e4e7; font-weight: 600;
      }
      .chat-close {
        background: none; border: none; color: #71717a; cursor: pointer;
        font-size: 20px; padding: 0 4px; transition: 0.15s;
      }
      .chat-close:hover { color: #fff; }

      .chat-channels {
        display: flex;
        gap: 6px;
        padding: 10px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        overflow-x: auto;
        flex-shrink: 0;
      }
      .chat-channels::-webkit-scrollbar { height: 0; }

      .channel-tab {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        color: #a1a1aa;
        padding: 5px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        transition: 0.15s;
        font-family: inherit;
      }
      .channel-tab:hover { background: rgba(255,255,255,0.1); color: #e4e4e7; }
      .channel-tab.active {
        background: #6366f1;
        border-color: #818cf8;
        color: #fff;
      }
      .channel-tab .unread {
        display: inline-block;
        background: #ef4444;
        color: #fff;
        font-size: 10px;
        min-width: 16px;
        height: 16px;
        line-height: 16px;
        text-align: center;
        border-radius: 10px;
        margin-left: 6px;
        padding: 0 4px;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chat-messages::-webkit-scrollbar { width: 4px; }
      .chat-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

      .chat-msg {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }
      .chat-msg.received {
        align-self: flex-start;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        color: #e4e4e7;
      }
      .chat-msg.sent {
        align-self: flex-end;
        background: #4338ca;
        border: 1px solid #6366f1;
        color: #fff;
      }
      .chat-msg .msg-sender {
        font-size: 11px;
        font-weight: 700;
        color: #818cf8;
        margin-bottom: 2px;
      }
      .chat-msg.sent .msg-sender { color: #c4b5fd; }
      .chat-msg .msg-time {
        font-size: 10px;
        color: #52525b;
        margin-top: 4px;
        text-align: right;
      }

      .chat-input-bar {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid rgba(255,255,255,0.08);
        background: #0c0c0f;
      }
      .chat-input-bar input {
        flex: 1;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        color: #e4e4e7;
        padding: 8px 12px;
        font-size: 13px;
        outline: none;
        font-family: inherit;
        transition: 0.15s;
      }
      .chat-input-bar input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 2px rgba(99,102,241,0.2);
      }
      .chat-input-bar button {
        background: #6366f1;
        border: none;
        color: #fff;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: 0.15s;
        font-family: inherit;
      }
      .chat-input-bar button:hover { background: #818cf8; }

      .chat-empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #3f3f46;
        font-size: 13px;
        text-align: center;
        padding: 2rem;
      }

      /* Chat toggle button in titlebar */
      .chat-toggle {
        background: none;
        border: 1px solid rgba(255,255,255,0.1);
        color: #71717a;
        padding: 4px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        transition: 0.15s;
        font-family: inherit;
        display: flex;
        align-items: center;
        gap: 5px;
        margin-right: 12px;
      }
      .chat-toggle:hover { color: #e4e4e7; border-color: #6366f1; background: rgba(99,102,241,0.1); }
      .chat-toggle .badge {
        background: #ef4444;
        color: #fff;
        font-size: 10px;
        min-width: 16px;
        height: 16px;
        line-height: 16px;
        text-align: center;
        border-radius: 10px;
        padding: 0 4px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="titlebar">
        <div class="back-container">
            <a href="index.html" class="back-btn" title="Back to Home">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
        </div>
        <div class="title">bash — ZeroRing OS</div>
        <button class="chat-toggle" id="chat-toggle" onclick="toggleChatPanel()">
            💬 Chat <span class="badge" id="chat-badge">0</span>
        </button>
        <div class="spacer"></div>
    </div>

    <div id="terminal" tabindex="0">
      <div id="drag-overlay"></div>
      <div id="output"></div>
      <div id="input-line">
          <span id="prompt"></span><span id="cmd"></span><span id="cursor"></span>
      </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" style="position: absolute; top: 40px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; pointer-events: none;"></div>

    <!-- Chat Panel -->
    <div id="chat-panel">
      <div class="chat-header">
        <h3>💬 ZeroRing Chat</h3>
        <button class="chat-close" onclick="toggleChatPanel()">×</button>
      </div>
      <div class="chat-channels" id="chat-channels">
        <button class="channel-tab active" data-channel="global" onclick="switchChannel('global')">🌐 Global</button>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-empty">No messages yet.<br>Start a conversation!</div>
      </div>
      <div class="chat-input-bar">
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" />
        <button onclick="sendChatFromPanel()">Send</button>
      </div>
    </div>
    
    <div id="editor-overlay">
      <div class="editor-window">
          <div id="editor-header">
            <div class="editor-tabs">
                <h3 id="editor-filename">filename.txt</h3>
            </div>
            <div class="editor-actions">
              <button class="editor-btn cancel" id="editor-cancel">Cancel</button>
              <button class="editor-btn" id="editor-save">Save File</button>
            </div>
          </div>
          <textarea id="editor-textarea" spellcheck="false"></textarea>
      </div>
    </div>
    
    <script src="terminal.js?v=3"></script>
  </body>
</html>
